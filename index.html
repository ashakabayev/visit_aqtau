<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visit Aktau — Джип-туры по Мангистау: однодневные и многодневные</title>
  <meta name="description"
    content="Visit Aktau — местный лицензированный туроператор в Мангистауской области. Однодневные и многодневные джип-туры к Бозжыре, Тузбаиру, Шеркале и подземным мечетям. Аренда дрона, квадроцикла, Starlink и джипа.">
  <link rel="preload" as="image" href="images/hero-bokty.jpg"
    imagesrcset="images/hero-bokty-sm.jpg 1200w, images/hero-bokty.jpg 2200w" imagesizes="100vw">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;600;700;800&family=Onest:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #0E2A30;
      --sea: #14555C;
      --sea-deep: #0A3B43;
      --chalk: #F1ECE1;
      --paper: #FBF8F1;
      --ochre: #C9913D;
      --apricot: #E0824E;
      --gold: #F4C98A;
      --line: rgba(14, 42, 48, .14);
      --radius: 18px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      font-family: 'Onest', system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    img,
    svg {
      display: block;
      max-width: 100%
    }

    a {
      color: inherit;
      text-decoration: none
    }

    ul {
      list-style: none
    }

    .wrap {
      max-width: 1220px;
      margin: 0 auto;
      padding: 0 24px
    }

    .eyebrow {
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--ochre);
      display: flex;
      align-items: center;
      gap: .7em;
    }

    .eyebrow::before {
      content: "";
      width: 34px;
      height: 1px;
      background: var(--ochre)
    }

    h1,
    h2,
    h3 {
      font-family: 'Geologica', sans-serif;
      line-height: 1.14;
      font-weight: 600
    }

    h2 {
      font-size: clamp(1.45rem, 3vw, 2.2rem);
      margin: .55em 0 .45em
    }

    .section {
      padding: 84px 0
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      margin-bottom: 44px;
      flex-wrap: wrap
    }

    .section-head p {
      color: rgba(14, 42, 48, .72);
      max-width: 560px
    }

    .more-link {
      font-weight: 800;
      font-size: .88rem;
      color: var(--sea-deep);
      white-space: nowrap;
      border-bottom: 2px solid var(--apricot);
      padding-bottom: 3px;
      transition: color .2s;
    }

    .more-link:hover {
      color: var(--apricot)
    }

    .btn {
      display: inline-block;
      padding: 13px 26px;
      border-radius: 999px;
      font-weight: 700;
      font-size: .92rem;
      background: var(--apricot);
      color: #fff;
      border: none;
      cursor: pointer;
      text-align: center;
      transition: transform .2s, box-shadow .2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(224, 130, 78, .35)
    }

    .btn.ghost {
      background: transparent;
      border: 1.5px solid rgba(255, 255, 255, .55);
      color: #fff
    }

    .btn.ghost:hover {
      background: rgba(255, 255, 255, .12);
      box-shadow: none
    }

    .btn.dark {
      background: var(--sea-deep)
    }

    .btn.dark:hover {
      box-shadow: 0 10px 24px rgba(10, 59, 67, .35)
    }

    .btn.line {
      background: transparent;
      border: 1.5px solid var(--sea-deep);
      color: var(--sea-deep)
    }

    .btn.line:hover {
      background: var(--sea-deep);
      color: #fff;
      box-shadow: none
    }

    /* ---------- Top bar ---------- */
    .topbar {
      background: var(--ink);
      color: rgba(255, 255, 255, .75);
      font-size: .8rem;
      position: relative;
      z-index: 60
    }

    .topbar .wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 38px;
      gap: 16px
    }

    .topbar a {
      transition: color .2s
    }

    .topbar a:hover {
      color: var(--gold)
    }

    .topbar .contacts {
      display: flex;
      gap: 20px;
      flex-wrap: wrap
    }

    .topbar .lang {
      display: flex;
      gap: 12px;
      font-weight: 700;
      letter-spacing: .08em
    }

    .topbar .lang .on {
      color: var(--gold)
    }

    /* ---------- Nav ---------- */
    .nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(251, 248, 241, .94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .nav>.wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
      gap: 20px
    }

    .logo {
      font-family: 'Geologica', sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--ink);
      white-space: nowrap
    }

    .logo span {
      color: var(--apricot)
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px
    }

    .nav-item {
      position: relative
    }

    .nav-item>a {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: .9rem;
      font-weight: 700;
      color: rgba(14, 42, 48, .85);
      transition: background .2s, color .2s;
      white-space: nowrap;
    }

    .nav-item>a:hover {
      background: var(--chalk);
      color: var(--sea-deep)
    }

    .nav-item>a .car {
      font-size: .6rem;
      transition: transform .25s
    }

    .dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      min-width: 240px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 20px 44px rgba(14, 42, 48, .16);
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      transition: .22s;
    }

    .nav-item:hover .dropdown,
    .nav-item:focus-within .dropdown {
      opacity: 1;
      visibility: visible;
      transform: none
    }

    .nav-item:hover>a .car {
      transform: rotate(180deg)
    }

    .dropdown a {
      display: block;
      padding: 9px 14px;
      border-radius: 9px;
      font-size: .88rem;
      font-weight: 600;
      color: rgba(14, 42, 48, .8);
      transition: background .15s, color .15s;
    }

    .dropdown a:hover {
      background: var(--chalk);
      color: var(--apricot)
    }

    .dropdown .dd-label {
      font-size: .66rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--ochre);
      padding: 10px 14px 4px;
    }

    .nav .btn {
      padding: 11px 22px;
      white-space: nowrap
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px
    }

    .menu-toggle span {
      display: block;
      width: 24px;
      height: 2px;
      background: var(--ink);
      margin: 5px 0;
      transition: .3s
    }

    /* ---------- Hero ---------- */
    /* Первый экран — фото горы Боқты фоном.
       Файл: images/hero-bokty.jpg (+ webp и мобильная версия -sm). */
    .hero {
      position: relative;
      min-height: 88svh;
      display: flex;
      align-items: center;
      --hero-photo: url('images/hero-bokty.jpg');
      background:
        var(--hero-photo, none) center/cover no-repeat,
        linear-gradient(180deg, #FBF8F1 0%, #F6EAD6 42%, #F0DCC0 72%, #E8CEA9 100%);
      overflow: hidden;
      color: var(--ink);
    }

    @media (max-width:900px) {
      .hero {
        --hero-photo: url('images/hero-bokty-sm.jpg');
        background-position: 62% center;
      }
    }

    /* WebP там, где браузер его поддерживает */
    @supports (background-image: image-set(url('images/hero-bokty.webp') type('image/webp'))) {
      .hero {
        --hero-photo: image-set(url('images/hero-bokty.webp') type('image/webp'),
            url('images/hero-bokty.jpg') type('image/jpeg'));
      }

      @media (max-width:900px) {
        .hero {
          --hero-photo: image-set(url('images/hero-bokty-sm.webp') type('image/webp'),
              url('images/hero-bokty-sm.jpg') type('image/jpeg'));
        }
      }
    }

    /* Светлая вуаль поверх фото, чтобы текст всегда читался */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(105deg, rgba(251, 248, 241, .93) 0%, rgba(251, 248, 241, .82) 34%, rgba(251, 248, 241, .42) 62%, rgba(251, 248, 241, .18) 100%),
        linear-gradient(180deg, rgba(251, 248, 241, .55) 0%, rgba(251, 248, 241, 0) 30%, rgba(232, 206, 169, .35) 100%);
    }

    @media (max-width:760px) {
      .hero::before {
        background:
          linear-gradient(180deg, rgba(251, 248, 241, .92) 0%, rgba(251, 248, 241, .80) 48%, rgba(251, 248, 241, .55) 100%);
      }
    }

    .hero-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none
    }

    .hero-content {
      position: relative;
      z-index: 2;
      padding: 90px 24px 110px;
      max-width: 828px
    }

    .hero .eyebrow {
      color: var(--ochre)
    }

    .hero .eyebrow::before {
      background: var(--ochre)
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.7rem);
      font-weight: 800;
      margin: .45em 0 .4em;
      letter-spacing: -.01em
    }

    .hero h1 em {
      font-style: normal;
      color: var(--apricot)
    }

    .hero p {
      font-size: clamp(1rem, 1.5vw, 1.14rem);
      color: rgba(14, 42, 48, .78);
      max-width: 580px
    }

    .hero-cta {
      display: flex;
      gap: 14px;
      margin-top: 34px;
      flex-wrap: wrap
    }

    .hero-badges {
      display: flex;
      gap: 26px;
      margin-top: 44px;
      flex-wrap: wrap
    }

    .hero-badges div {
      font-size: .8rem;
      color: rgba(14, 42, 48, .68)
    }

    .hero-badges b {
      display: block;
      font-family: 'Geologica', sans-serif;
      font-size: 1.2rem;
      color: var(--sea-deep);
      font-weight: 600
    }

    /* Прозрачная кнопка на светлом фоне */
    .hero .btn.ghost {
      border-color: rgba(14, 42, 48, .32);
      color: var(--ink)
    }

    .hero .btn.ghost:hover {
      background: rgba(14, 42, 48, .07)
    }

    /* ---------- Marquee ---------- */
    .marquee {
      background: var(--sea-deep);
      color: var(--chalk);
      overflow: hidden;
      padding: 15px 0;
      white-space: nowrap
    }

    .marquee-track {
      display: inline-flex;
      gap: 48px;
      animation: slide 32s linear infinite;
      font-family: 'Geologica', sans-serif;
      font-size: .8rem;
      letter-spacing: .08em
    }

    .marquee-track i {
      font-style: normal;
      color: var(--apricot)
    }

    @keyframes slide {
      to {
        transform: translateX(-50%)
      }
    }

    /* ---------- Tour cards ---------- */
    .cards-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px
    }

    .cards-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px
    }

    .tcard {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform .3s, box-shadow .3s;
    }

    .tcard:hover {
      transform: translateY(-6px);
      box-shadow: 0 22px 44px rgba(14, 42, 48, .12)
    }

    .tcard-art {
      height: 160px;
      position: relative;
      overflow: hidden
    }

    .tcard-art svg {
      width: 100%;
      height: 100%;
      transition: transform .6s ease
    }

    .tcard:hover .tcard-art svg {
      transform: scale(1.06)
    }

    .tcard-tag {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(10, 59, 67, .85);
      color: #fff;
      font-size: .64rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 999px;
      backdrop-filter: blur(4px);
    }

    .tcard-body {
      padding: 20px 20px 22px;
      display: flex;
      flex-direction: column;
      flex: 1
    }

    .tcard-body h3 {
      font-size: .98rem;
      margin-bottom: 10px;
      min-height: 2.4em
    }

    .tcard-meta {
      font-size: .8rem;
      color: rgba(14, 42, 48, .6);
      font-weight: 600;
      margin-bottom: 16px
    }

    .tcard-meta i {
      font-style: normal;
      color: var(--apricot);
      padding: 0 4px
    }

    .tcard-foot {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px
    }

    .tcard .price {
      font-family: 'Geologica', sans-serif;
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--sea-deep)
    }

    .tcard .price small {
      font-family: 'Onest', sans-serif;
      font-size: .7rem;
      font-weight: 700;
      color: rgba(14, 42, 48, .55);
      display: block
    }

    .tcard .btn {
      padding: 10px 18px;
      font-size: .8rem
    }

    .alt {
      background: var(--chalk)
    }

    /* ---------- Attractions gallery ---------- */
    .gallery {
      background: var(--sea-deep);
      color: #fff
    }

    .gallery .section-head p {
      color: rgba(255, 255, 255, .75)
    }

    .gallery .eyebrow {
      color: var(--gold)
    }

    .gallery .eyebrow::before {
      background: var(--gold)
    }

    /* Достопримечательности — карусель в один ряд */
    .g-carousel {
      position: relative
    }

    .g-grid {
      --g-cols: 4;
      display: flex;
      gap: 18px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
      padding-bottom: 4px
    }

    .g-grid::-webkit-scrollbar {
      display: none
    }

    .g-grid>.g-tile {
      flex: 0 0 calc((100% - (var(--g-cols) - 1) * 18px) / var(--g-cols));
      scroll-snap-align: start
    }

    .g-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 3;
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      background: #fff;
      color: var(--ink);
      box-shadow: 0 8px 24px rgba(10, 30, 35, .28);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .25s, transform .2s
    }

    .g-nav:hover {
      transform: translateY(-50%) scale(1.08)
    }

    .g-nav svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .g-nav.prev {
      left: -18px
    }

    .g-nav.next {
      right: -18px
    }

    .g-nav[disabled] {
      opacity: 0;
      pointer-events: none
    }

    .g-tile {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      aspect-ratio: 4/3;
      cursor: pointer;
    }

    .g-tile svg {
      width: 100%;
      height: 100%;
      transition: transform .6s ease
    }

    .g-tile:hover svg {
      transform: scale(1.08)
    }

    .g-tile span {
      position: absolute;
      left: 14px;
      bottom: 12px;
      z-index: 2;
      font-family: 'Geologica', sans-serif;
      font-size: .74rem;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, .5);
    }

    .g-tile::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 55%, rgba(10, 30, 35, .65));
    }

    /* ---------- Why us ---------- */
    .why-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px
    }

    .why {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 28px 26px
    }

    .why-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: var(--sea-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .why-icon svg {
      width: 24px;
      height: 24px;
      stroke: var(--gold);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .why h3 {
      font-size: .92rem;
      margin-bottom: 8px
    }

    .why p {
      font-size: .88rem;
      color: rgba(14, 42, 48, .7)
    }

    /* ---------- CTA ---------- */
    .cta {
      background: linear-gradient(135deg, #0A3B43 0%, #14555C 55%, #9C5B33 130%);
      color: #fff;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .cta .wrap {
      position: relative;
      z-index: 2;
      max-width: 720px
    }

    .cta h2 {
      font-size: clamp(1.6rem, 3.4vw, 2.4rem)
    }

    .cta p {
      color: rgba(255, 255, 255, .85);
      margin-bottom: 32px
    }

    .cta-form {
      display: flex;
      gap: 12px;
      max-width: 540px;
      margin: 0 auto;
      flex-wrap: wrap;
      justify-content: center
    }

    .cta-form input {
      flex: 1;
      min-width: 240px;
      padding: 14px 22px;
      border-radius: 999px;
      border: 1.5px solid rgba(255, 255, 255, .35);
      background: rgba(255, 255, 255, .1);
      color: #fff;
      font-family: inherit;
      font-size: .95rem;
      outline: none;
    }

    .cta-form input::placeholder {
      color: rgba(255, 255, 255, .6)
    }

    .cta-form input:focus {
      border-color: var(--gold)
    }

    .cta-note {
      font-size: .8rem;
      color: rgba(255, 255, 255, .55);
      margin-top: 16px
    }

    /* ---------- Footer ---------- */
    footer {
      background: var(--ink);
      color: rgba(255, 255, 255, .7);
      padding: 64px 0 32px;
      font-size: .88rem
    }

    .foot-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr 1fr;
      gap: 40px;
      margin-bottom: 48px
    }

    .foot-grid .logo {
      color: #fff;
      margin-bottom: 14px;
      display: block
    }

    .foot-grid h4 {
      color: #fff;
      font-size: .74rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      margin-bottom: 16px
    }

    .foot-grid li {
      margin-bottom: 9px
    }

    .foot-grid a:hover {
      color: var(--apricot)
    }

    .socials {
      display: flex;
      gap: 12px;
      margin-top: 18px
    }

    .socials a {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .04em;
      transition: .2s;
    }

    .socials a:hover {
      background: var(--apricot);
      border-color: var(--apricot);
      color: #fff
    }

    .foot-bottom {
      border-top: 1px solid rgba(255, 255, 255, .12);
      padding-top: 24px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      font-size: .78rem;
      color: rgba(255, 255, 255, .45)
    }

    /* ---------- Reveal ---------- */
    .reveal {
      opacity: 0;
      transform: translateY(26px);
      transition: opacity .7s ease, transform .7s ease
    }

    .reveal.in {
      opacity: 1;
      transform: none
    }

    @media (prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important
      }

      .reveal {
        opacity: 1;
        transform: none
      }

      html {
        scroll-behavior: auto
      }
    }

    /* ---------- Responsive ---------- */
    @media (max-width:1060px) {
      .cards-4 {
        grid-template-columns: 1fr 1fr
      }

      .cards-3 {
        grid-template-columns: 1fr 1fr
      }

      .g-grid {
        --g-cols: 3
      }

      .why-grid {
        grid-template-columns: 1fr 1fr
      }
    }

    @media (max-width:1100px) {

      /* backdrop-filter would make .nav the containing block for the
         position:fixed menu panel, collapsing it to the nav bar height */
      .nav {
        backdrop-filter: none;
        background: var(--paper)
      }

      .nav>.wrap .langsel {
        position: relative;
        z-index: 51
      }

      .nav-links {
        position: fixed;
        inset: 0;
        top: 0;
        background: var(--paper);
        flex-direction: column;
        align-items: stretch;
        padding: 90px 24px 40px;
        gap: 2px;
        overflow-y: auto;
        z-index: 49;
        transform: translateX(110%);
        transition: transform .35s ease;
      }

      .nav-links.open {
        transform: none
      }

      .nav-item>a {
        justify-content: space-between;
        font-size: 1rem
      }

      .dropdown {
        position: static;
        opacity: 1;
        visibility: visible;
        transform: none;
        box-shadow: none;
        border: none;
        background: var(--chalk);
        margin: 4px 0 10px;
        display: none;
      }

      .nav-item.open .dropdown {
        display: block
      }

      .menu-toggle {
        display: block;
        position: relative;
        z-index: 51
      }

      .nav .cta-btn {
        display: none
      }

      .topbar .contacts span.hide-m {
        display: none
      }
    }

    @media (max-width:640px) {
      .section {
        padding: 62px 0
      }

      .cards-4,
      .cards-3 {
        grid-template-columns: 1fr
      }

      .g-grid {
        --g-cols: 2
      }

      .g-nav.prev {
        left: 4px
      }

      .g-nav.next {
        right: 4px
      }

      .why-grid {
        grid-template-columns: 1fr
      }

      .foot-grid {
        grid-template-columns: 1fr 1fr
      }

      .topbar .lang {
        display: none
      }
    }

    /* ============ ADDED: spec components ============ */

    /* --- Photo slot inside cards (drop real photos into TOURS data) --- */
    .tcard-art img,
    .g-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .5s
    }

    .tcard:hover .tcard-art img {
      transform: scale(1.05)
    }

    .tcard-body>.locs {
      font-size: .88rem;
      color: rgba(14, 42, 48, .8);
      margin-bottom: 12px
    }

    .incl {
      list-style: none;
      margin: 0 0 14px;
      font-size: .86rem;
      color: rgba(14, 42, 48, .78)
    }

    .incl li {
      position: relative;
      padding-left: 20px;
      margin-bottom: 5px
    }

    .incl li::before {
      content: "";
      position: absolute;
      left: 2px;
      top: .55em;
      width: 9px;
      height: 5px;
      border-left: 2px solid var(--ochre);
      border-bottom: 2px solid var(--ochre);
      transform: rotate(-45deg)
    }

    .incl.no li::before {
      border: none;
      left: 4px;
      top: .5em;
      width: 8px;
      height: 2px;
      background: rgba(14, 42, 48, .35);
      transform: none
    }

    .price-sub {
      display: block;
      font-family: 'Onest', sans-serif;
      font-size: .74rem;
      font-weight: 600;
      color: rgba(14, 42, 48, .5);
      letter-spacing: 0
    }

    /* --- Package price table --- */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      -webkit-overflow-scrolling: touch
    }

    table.pt {
      border-collapse: collapse;
      width: 100%;
      min-width: 720px;
      font-size: .92rem
    }

    table.pt th,
    table.pt td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      vertical-align: top
    }

    table.pt thead th {
      background: var(--sea-deep);
      color: #fff;
      font-family: 'Geologica', sans-serif;
      font-weight: 600;
      font-size: .8rem;
      white-space: nowrap

    table.pt tbody th {
      font-family: 'Geologica', sans-serif;
      font-size: .85rem;
      font-weight: 600;
      background: var(--chalk);
      white-space: nowrap

    table.pt tbody tr:last-child th,
    table.pt tbody tr:last-child td {
      border-bottom: none

    table.pt td b {
      font-size: 1.02rem
    }

    .table-note {
      font-size: .82rem;
      color: rgba(14, 42, 48, .6);
      margin-top: 12px

    /* --- About / stats / partners --- */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 44px

    .stat {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 28px 24px;
      text-align: center
    }

    .stat b {
      display: block;
      font-family: 'Geologica', sans-serif;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      color: var(--sea-deep);
      line-height: 1
    }

    .stat span {
      display: block;
      margin-top: 8px;
      font-size: .88rem;
      color: rgba(14, 42, 48, .68)
    }

    .partners {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center
    }

    .partners .p-chip {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 11px 22px;
      font-weight: 700;
      font-size: .9rem;
      color: var(--sea-deep)

    .partners-label {
      font-weight: 800;
      font-size: .78rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--ochre);
      margin-bottom: 16px

    /* --- Rental --- */
    .rent-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px

    .rent {

      border: 1px solid var(--line);

      padding: 26px;
      display: flex;
      flex-direction: column

    .rent .r-icon {

      height: 46px;

      place-items: center;
      margin-bottom: 16px

    .rent .r-icon svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: var(--sea-deep);
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round

    .rent h3 {
      font-size: 1.02rem;
      margin-bottom: 6px

    .rent .r-price {
      font-family: 'Geologica', sans-serif;

      color: var(--sea-deep);

    .rent .r-price small {

      font-weight: 600;
      color: rgba(14, 42, 48, .55)

    .rent .btn {

    /* --- Builder (constructor) --- */

    .builder .eyebrow {
      color: var(--gold)

    .builder .eyebrow::before {

    .builder .section-head p {

    .b-card {
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: var(--radius);

    .b-step {
      margin-bottom: 30px
    }

    .b-step:last-of-type {
      margin-bottom: 0

    .b-step h3 {
      font-size: .95rem;
      color: var(--gold);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px
    }

    .b-step h3 i {
      font-style: normal;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--gold);
      color: var(--sea-deep);
      display: grid;
      place-items: center;
      font-size: .78rem;
      font-weight: 800;
      flex: none

    .b-group-label {
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .5);
      margin: 18px 0 10px

    .b-group-label:first-child {
      margin-top: 0
    }

    .checks {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
      gap: 8px
    }

    .chk {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .05);
      border: 1px solid rgba(255, 255, 255, .12);
      cursor: pointer;
      font-size: .88rem;
      transition: background .18s, border-color .18s
    }

    .chk:hover {
      background: rgba(255, 255, 255, .11)
    }

    .chk input {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      flex: none;
      border-radius: 5px;
      border: 1.5px solid rgba(255, 255, 255, .45);
      cursor: pointer;
      position: relative;
      margin: 0
    }

    .chk input:checked {
      background: var(--apricot);
      border-color: var(--apricot)
    }

    .chk input:checked::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 3px;
      width: 5px;
      height: 9px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(42deg)
    }

    .chk:has(input:checked) {
      background: rgba(224, 130, 78, .2);
      border-color: rgba(224, 130, 78, .6)
    }

    .b-fields {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .field span {
      font-size: .8rem;
      color: rgba(255, 255, 255, .65)
    }

    .field input,
    .field select,
    .field textarea {
      font-family: inherit;
      font-size: .92rem;
      color: #fff;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
      width: 100%
    }

    .field textarea {
      resize: vertical;
      min-height: 86px
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: rgba(255, 255, 255, .4)
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--gold)
    }

    .field select option {
      color: var(--ink)
    }

    .b-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
      margin-top: 26px;
      padding-top: 22px;
      border-top: 1px solid rgba(255, 255, 255, .16)
    }

    .b-summary {
      font-size: .88rem;
      color: rgba(255, 255, 255, .72)
    }

    .b-summary b {
      color: #fff
    }

    .btn.wa {
      background: #25D366;
      color: #06251a;
      display: inline-flex;
      align-items: center;
      gap: 9px
    }

    .btn.wa:hover {
      box-shadow: 0 10px 24px rgba(37, 211, 102, .35)
    }

    .btn.wa svg {
      width: 18px;
      height: 18px;
      fill: currentColor
    }

    /* --- FAQ --- */
    .faq {
      max-width: 860px;
      margin: 0 auto
    }

    .faq details {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      margin-bottom: 12px;
      overflow: hidden
    }

    .faq summary {
      list-style: none;
      cursor: pointer;
      padding: 18px 54px 18px 22px;
      font-weight: 700;
      font-size: .96rem;
      position: relative
    }

    .faq summary::-webkit-details-marker {
      display: none
    }

    .faq summary::after {
      content: "";
      position: absolute;
      right: 24px;
      top: 24px;
      width: 9px;
      height: 9px;
      border-right: 2px solid var(--ochre);
      border-bottom: 2px solid var(--ochre);
      transform: rotate(45deg);
      transition: transform .2s
    }

    .faq details[open] summary::after {
      transform: rotate(225deg);
      top: 27px
    }

    .faq details p {
      padding: 0 22px 20px;
      color: rgba(14, 42, 48, .74);
      font-size: .92rem
    }

    /* --- Modal --- */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      padding: 24px;
      overflow-y: auto
    }

    .modal.open {
      display: block
    }

    .modal-bd {
      position: fixed;
      inset: 0;
      background: rgba(6, 34, 40, .72);
      backdrop-filter: blur(3px)
    }

    .modal-box {
      position: relative;
      max-width: 900px;
      margin: 40px auto;
      background: var(--paper);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(6, 34, 40, .4)
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 3;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(6, 34, 40, .55);
      color: #fff;
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer
    }

    .modal-close:hover {
      background: var(--apricot)
    }

    .modal-hero {
      height: 200px;
      position: relative;
      overflow: hidden
    }

    .modal-hero svg,
    .modal-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .modal-body {
      padding: 30px 34px 34px
    }

    .modal-body h2 {
      margin-top: 0
    }

    .modal-price {
      font-family: 'Geologica', sans-serif;
      font-size: clamp(1.8rem, 5vw, 2.6rem);

      line-height: 1.1;
      margin: 4px 0 2px
    }

    .modal-price small {
      font-family: 'Onest', sans-serif;
      font-size: .82rem;
      font-weight: 600;
      color: rgba(14, 42, 48, .55)
    }

    .m-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 22px
    }

    .m-meta span {
      background: var(--chalk);
      border-radius: 999px;
      padding: 7px 15px;
      font-size: .82rem;
      font-weight: 600
    }

    .m-sub {
      font-family: 'Geologica', sans-serif;
      font-size: .95rem;
      margin: 26px 0 14px
    }

    .days {
      border-left: 2px dashed rgba(14, 42, 48, .22);
      margin-left: 9px;
      padding-left: 22px
    }

    .day {
      position: relative;
      padding-bottom: 18px
    }

    .day::before {
      content: "";
      position: absolute;
      left: -30px;
      top: 4px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--apricot);
      border: 3px solid var(--paper)
    }

    .day b {
      display: block;
      font-size: .8rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--ochre)

    .day p {
      font-size: .94rem

    .pkg-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);

    .pkg-tab {

      font-weight: 600;

      padding: 18px;

    }

      align-items: center;

      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px

      font-size: 1.45rem;
      color: var(--sea-deep)
    }

    .pkg-pane .pp small {
      font-family: 'Onest', sans-serif;
      font-size: .72rem;
      font-weight: 600;
      color: rgba(14, 42, 48, .5);
      display: block
    }

    .pkg {

      border-radius: 14px;
      background: #fff;

    .pkg.best {

    .pkg h4 {
      font-family: 'Geologica', sans-serif;
      font-size: .88rem;
      margin-bottom: 4px
    }

    .pkg .pp {
      font-family: 'Geologica', sans-serif;
      font-size: 1.45rem;
      color: var(--sea-deep);
      margin-bottom: 10px
    }

    .pkg .pp small {
      font-family: 'Onest', sans-serif;
      font-size: .72rem;
      font-weight: 600;
      color: rgba(14, 42, 48, .5);
      display: block
    }

    .two-col {

      grid-template-columns: 1fr 1fr;

    .modal-cta {

      flex-wrap: wrap;

    /* --- Floating WhatsApp --- */
    .fab {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 150;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #25D366;
      display: grid;
      place-items: center;
      box-shadow: 0 10px 26px rgba(37, 211, 102, .45);

    }

    .fab:hover {
      transform: scale(1.08)
    }

    .fab svg {
      width: 28px;
      height: 28px;
      fill: #fff
    }

    .socials a svg {
      width: 18px;
      height: 18px;
      fill: currentColor
    }

    @media (max-width:1060px) {
      .rent-grid {
        grid-template-columns: repeat(2, 1fr)

      .b-fields {

    @media (max-width:860px) {

        padding: 0

      .modal-box {
        margin: 0;
        border-radius: 0;

        padding: 24px 20px 30px
      }

        grid-template-columns: 1fr
      }

      .pkg-tabs {
        grid-template-columns: 1fr

        grid-template-columns: 1fr
      }
    }

    @media (max-width:640px) {
      .stats {
        grid-template-columns: 1fr
      }

      .rent-grid {
        grid-template-columns: 1fr
      }

      .b-fields {
        grid-template-columns: 1fr
      }

      .b-card {
        padding: 22px 18px
      }

      .checks {
        grid-template-columns: 1fr
      }
    }

    /* ============ ADDED: language switcher ============ */
    .langsel {
      display: flex;
      gap: 2px;
      background: rgba(14, 42, 48, .07);
      border-radius: 999px;
      padding: 3px;

    .langsel button {
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .05em;
      padding: 6px 10px;
      border-radius: 999px;
      cursor: pointer;
      color: rgba(14, 42, 48, .62);
      transition: background .18s, color .18s;
      white-space: nowrap
    }

    }

    .langsel button.on {
      background: var(--sea-deep);
      color: #fff
    }

    .nav>.wrap .langsel {
      margin-left: auto
    }

    @media (max-width:1100px) {
      .nav>.wrap .langsel {
        margin-left: auto;
        margin-right: 4px
      }

      .langsel button {
        padding: 6px 8px;
        font-size: .68rem
      }
    }

    @media (max-width:420px) {
      .langsel button {
        padding: 5px 6px;
        font-size: .64rem;
        letter-spacing: 0
      }
    }

    /* zh needs a font stack that actually has the glyphs */
    html[lang="zh"] body {

    }

    html[lang="zh"] .b-group-label,
    html[lang="zh"] .tcard-tag {
      letter-spacing: .08em
    }
  </style>
</head>

    function renderGallery() {
      document.getElementById('placesGrid').innerHTML = GALLERY.map(g => `
        <div class="g-tile">
          ${g.photo ? `<img src="${g.photo}" alt="" loading="lazy">` : artSvg(g.art)}
          <span>${g.ui ? t(g.key) : loc(g.key)}</span>
        </div>`).join('');
      updateGalleryNav();
    }

    /* Карусель достопримечательностей */
    const gTrack = document.getElementById('placesGrid');
    const gPrev = document.getElementById('placesPrev');
    const gNext = document.getElementById('placesNext');

    function galleryStep() {
      const tile = gTrack.querySelector('.g-tile');
      return tile ? tile.getBoundingClientRect().width + 18 : gTrack.clientWidth;
    }

    function updateGalleryNav() {
      const max = gTrack.scrollWidth - gTrack.clientWidth - 1;
      gPrev.disabled = gTrack.scrollLeft <= 0;
      gNext.disabled = gTrack.scrollLeft >= max;
    }

    gPrev.addEventListener('click', () => gTrack.scrollBy({ left: -galleryStep(), behavior: 'smooth' }));
    gNext.addEventListener('click', () => gTrack.scrollBy({ left: galleryStep(), behavior: 'smooth' }));
    gTrack.addEventListener('scroll', updateGalleryNav, { passive: true });
    window.addEventListener('resize', updateGalleryNav);

       FAQ

      document.getElementById('faqList').innerHTML = FAQ.map((f, i) => `

          <p>${tr(f.a)}</p>

    }

      document.getElementById('builderChecks').innerHTML = PLACE_GROUPS.map(g => `

        <div class="checks">

      const daysSel = document.getElementById('bDays');
      const prevDays = daysSel.selectedIndex;
      daysSel.innerHTML = [1, 2, 3, 4, 5, 6, 7].map(n => `<option value="${dayWord(n)}">${dayWord(n)}</option>`).join('')
        + `<option value="${t('bd.daysPlus')}">${t('bd.daysPlus')}</option>`;
      daysSel.selectedIndex = prevDays >= 0 ? prevDays : 2;

      const pkgSel = document.getElementById('bPkg');
      const prevPkg = pkgSel.selectedIndex;
      pkgSel.innerHTML = PKG_KEYS.map(k => `<option value="${t(PACKAGES[k].name)}">${t(PACKAGES[k].name)}</option>`).join('');
      pkgSel.selectedIndex = prevPkg >= 0 ? prevPkg : 1;

      updateSummary();
    }

    function updateSummary() {
      const sel = selectedPlaces();
      bSummary.innerHTML = `${t('bd.selected')} <b>${sel.length}</b>` +

    bForm.addEventListener('change', updateSummary);

      const msg = [
        t('wa.bTitle'),
        '',
        `${t('wa.bPlaces')} ${places.map(loc).join(t('sep.comma'))}`,
        `${t('wa.bDays')} ${v('bDays')}`,

        `${t('wa.bPax')} ${v('bPax') || '—'}`,

        v('bName') ? `${t('wa.bName')} ${v('bName')}` : '',
        v('bPhone') ? `${t('wa.bPhone')} ${v('bPhone')}` : '',
        v('bWish') ? `${t('wa.bWish')} ${v('bWish')}` : ''
      ].filter(l => l !== '').join('\n');
      window.open(waLink(msg), '_blank', 'noopener');
    });

    /* ============================================================
       МОДАЛЬНОЕ ОКНО
       ============================================================ */
    const modal = document.getElementById('modal');
    const modalHero = document.getElementById('modalHero');
    const modalBody = document.getElementById('modalBody');
    let openTour = null;   // {kind:'multi'|'one', id}

    function closeModal() {
      openTour = null;
      modal.classList.remove('open');
      document.body.style.overflow = '';
    }
    modal.addEventListener('click', e => { if (e.target.hasAttribute('data-close')) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && openTour) closeModal(); });

    function show(hero, html) {
      modalHero.innerHTML = hero;
      modalBody.innerHTML = html;
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function openMulti(id) {
      const x = MULTI_DAY.find(m => m.id === id);
      if (!x) return;
      openTour = { kind: 'multi', id };
      const pr = PRICES[x.days], title = tr(x.title);
      show(media(x), `
        <p class="eyebrow">${t('c.multiTour')} · ${dayWord(x.days)}</p>
        <h2 id="modalTitle">${title}</h2>
        <p class="modal-price">${fromPrice(pr.eco + ' $')} <small>${t('c.priceEco')}</small></p>
        <div class="m-meta">
          <span>${dayWord(x.days)}</span>
          <span>${t('c.length')} ≈ ${numFmt(x.km)} ${t('unit.km')}</span>
          <span>${t('c.threePkgBadge')}</span>
          <span>${t('c.startAktau')}</span>
        </div>

        <h3 class="m-sub">${t('c.routeByDay')}</h3>
        <div class="days">${x.plan.map((d, i) =>
        `<div class="day"><b>${ordDay(i + 1)}</b><p>${locs(d)}</p></div>`).join('')}</div>

        <h3 class="m-sub">${t('c.threePkgTitle')}</h3>
        <div class="pkg-tabs" role="tablist">
          ${PKG_KEYS.map(k => `
            <button type="button" class="pkg-tab" role="tab" data-pkg="${k}" aria-selected="false">
              <span class="pt-name">${t(PACKAGES[k].name)}</span>
              <span class="pt-price">${pr[k]} $</span>
              <span class="pt-per">${t('c.perPerson')}</span>
            </button>`).join('')}
        </div>
        <div class="pkg-pane" id="pkgPane"></div>

        <div class="modal-cta">
          <a class="btn wa" target="_blank" rel="noopener"
             href="${waLink(`${t('wa.bookTour')} «${title}» (${dayWord(x.days)}).`)}">${WA_SVG}${t('c.bookWa')}</a>
          <a class="btn line" href="#builder" data-close>${t('c.customize')}</a>
        </div>`);
      showPkg(x, curPkg);
    }

    /* Пакеты в модалке — вкладки: показываем информацию только выбранного пакета */
    let curPkg = 'std';

    function showPkg(x, key) {
      curPkg = PKG_KEYS.includes(key) ? key : 'std';
      const pane = document.getElementById('pkgPane');
      if (!pane) return;
      modalBody.querySelectorAll('.pkg-tab').forEach(b => {
        const on = b.dataset.pkg === curPkg;
        b.classList.toggle('on', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      const pkg = PACKAGES[curPkg], nm = t(pkg.name), pr = PRICES[x.days], title = tr(x.title);
      pane.innerHTML = `
        <div class="pkg-pane-head">
          <div>
            <p class="b-group-label" style="color:var(--ochre);margin:0">${t('c.pkgLabel')} «${nm}»</p>
            <p class="pp">${pr[curPkg]} $<small>${t('c.perPerson')}</small></p>
          </div>
          <a class="btn dark" style="font-size:.82rem;padding:10px 18px" target="_blank" rel="noopener"
             href="${waLink(`${t('wa.bookTour')} «${title}» (${dayWord(x.days)}), ${t('wa.pkgWord')} «${nm}» — ${pr[curPkg]} $ / ${t('c.perPerson')}.`)}">${t('c.book')}</a>
        </div>
        <div class="two-col">
          <div><p style="font-weight:700;font-size:.86rem;margin-bottom:8px">${t('c.inclTitle')}</p>
            <ul class="incl">${list(pkg.inc)}</ul></div>
          <div><p style="font-weight:700;font-size:.86rem;margin-bottom:8px">${t('c.exclTitle')}</p>
            <ul class="incl no">${list(pkg.exc)}</ul></div>
        </div>`;
    }

    function openOneDay(id) {
      const x = ONE_DAY.find(o => o.id === id);
      if (!x) return;
      openTour = { kind: 'one', id };
      const title = tr(x.title);
      show(media(x), `
        <p class="eyebrow">${t('c.oneTour')}</p>
        <h2 id="modalTitle">${title}</h2>
        <p class="modal-price">${tourUsd(x)} <small>${kztFmt(x.kzt)} ${t('c.perJeepFull')}</small></p>
        <div class="m-meta">
          <span>${t('c.oneDay')}</span>
          <span>${t('c.startAktau')}</span>
          <span>${x.choose ? t('c.chooseLoc') : locWord(x.locations.length)}</span>
        </div>

        <h3 class="m-sub">${x.choose ? t('c.chooseLoc') : t('c.routeStops')}</h3>
        <div class="days">${x.locations.map((l, i) =>
        `<div class="day"><b>${x.choose ? t('c.option') + ' ' + (i + 1) : ordPoint(i + 1)}</b><p>${loc(l)}</p></div>`).join('')}</div>

        <h3 class="m-sub">${t('c.whatIncluded')}</h3>
        <ul class="incl">${list(x.includes)}</ul>

        <div class="modal-cta">
          <a class="btn wa" target="_blank" rel="noopener"
             href="${waLink(`${t('wa.bookDay')} «${title}» — ${kztFmt(x.kzt)} (${tourUsd(x)}) ${t('c.perJeep')}.`)}">${WA_SVG}${t('c.bookWa')}</a>
        </div>`);
    }

    document.addEventListener('click', e => {
      const tab = e.target.closest('.pkg-tab');
      if (tab && openTour && openTour.kind === 'multi') {
        showPkg(MULTI_DAY.find(m => m.id === openTour.id), tab.dataset.pkg);
        return;
      }
      const md = e.target.closest('[data-multi-open]');
      if (md) { openMulti(md.dataset.multiOpen); return; }
      const card = e.target.closest('[data-multi]');
      if (card) { openMulti(card.dataset.multi); return; }
      const od = e.target.closest('[data-book-oneday]');
      if (od) { openOneDay(od.dataset.bookOneday); return; }
      const oc = e.target.closest('[data-oneday]');
      if (oc) { openOneDay(oc.dataset.oneday); }
    });

    /* ============================================================
       ПЕРЕКЛЮЧЕНИЕ ЯЗЫКА
       ============================================================ */
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: .12 });
    const observeReveals = () => document.querySelectorAll('.reveal:not(.in)').forEach(el => io.observe(el));

    function renderAll() {
      applyStatic();
      renderMultiDay();
      renderOneDay();
      renderTables();
      renderRent();
      renderGallery();
      renderFaq();
      renderBuilder();
      observeReveals();
      if (openTour) (openTour.kind === 'multi' ? openMulti : openOneDay)(openTour.id);
    }

    function setLang(code, save = true) {
      const i = LANGS.indexOf(code);
      if (i < 0) return;
      li = i;
      if (save) { try { localStorage.setItem('va_lang', code); } catch (e) { } }
      renderAll();
    }

    document.getElementById('langSel').addEventListener('click', e => {
      const b = e.target.closest('[data-lang]');
      if (b) setLang(b.dataset.lang);
    });

    // Начальный язык: сохранённый выбор → язык браузера → русский
    (function initLang() {
      let code = null;
      try { code = localStorage.getItem('va_lang'); } catch (e) { }
      if (!LANGS.includes(code)) {
        const nav = (navigator.language || 'ru').toLowerCase();
        code = nav.startsWith('kk') ? 'kk' : nav.startsWith('zh') ? 'zh' : nav.startsWith('en') ? 'en' : 'ru';
      }
      setLang(code, false);
    })();

    /* ============================================================
       НАВИГАЦИЯ
       ============================================================ */
    const toggle = document.getElementById('menuToggle');
    const links = document.getElementById('navLinks');
    toggle.addEventListener('click', () => {
      const open = links.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open);
    });

    links.querySelectorAll('.nav-item > a').forEach(a => {
      a.addEventListener('click', e => {
        if (window.innerWidth <= 1100 && a.parentElement.querySelector('.dropdown')) {
          e.preventDefault();
          a.parentElement.classList.toggle('open');
        }
      });
    });
    links.querySelectorAll('.dropdown a, .cta-btn a, .nav-item:not(:has(.dropdown)) > a').forEach(a =>
      a.addEventListener('click', () => links.classList.remove('open'))
    );
  </script>
</body>

</html>
